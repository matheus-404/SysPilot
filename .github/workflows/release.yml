name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Publish application
        run: dotnet publish SysPilot.csproj -c Release -o publish -r win-x64 --self-contained true

      - name: Pack with Velopack
        run: >
          vpk pack
          -u SysPilot
          -v ${{ steps.get_version.outputs.VERSION }}
          -p publish
          -e SysPilot.exe
          -i Assets\Icons\SysPilot.ico

      - name: Publish to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/matheus-404/SysPilot
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ github.ref_name }}
